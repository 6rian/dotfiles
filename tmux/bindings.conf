# vim:set ft=tmux:

# Key bindings: prefix, reload, splits, pane/window movement, resizing.
# Popups live in popups.conf; bindings that must override a plugin live in
# after-plugins.conf.

# Keymap to reload tmux config
unbind r
bind -N "Reload ~/.tmux.conf" r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# Set prefix key
set -g prefix C-space
unbind C-b
bind -N "Send the prefix to the app" C-space send-prefix

# Skip "kill-pane 1? (y/n)" prompt
bind-key -N "Kill the pane (no confirmation)" x kill-pane

# New session, prompting for a name
bind -N "New session (prompts for a name)" S command-prompt -p "New session name:" "new-session -s '%%'"

# Use HJKL to navigate panes
# bind-key h select-pane -L
# bind-key j select-pane -D
# bind-key k select-pane -U
# bind-key l select-pane -R

# Shift arrow to switch windows
bind -N "Previous window" -n S-Left  previous-window
bind -N "Next window" -n S-Right next-window

# Ctrl-Shift arrow to move the current window left/right
bind -N "Move window left" -n C-S-Left  swap-window -t -1 \; previous-window
bind -N "Move window right" -n C-S-Right swap-window -t +1 \; next-window

# Open the new panes in the current path
bind -N "Split top/bottom" v split-window -v -c "#{pane_current_path}"
bind -N "Split left/right" h split-window -h -c "#{pane_current_path}"

# Split panes using | and -
bind -N "Split left/right" | split-window -h -c "#{pane_current_path}"
bind -N "Split top/bottom" - split-window -v -c "#{pane_current_path}"

# Pane resizing. is_vim is vim-tmux-navigator's check (keep in sync with its
# vim-tmux-navigator.tmux), so M-hjkl pass through to nvim (and fzf).
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -N "Resize pane left (nvim gets M-h)" -n 'M-h' if-shell "$is_vim" 'send-keys M-h' 'resize-pane -L 8'
bind -N "Resize pane down (nvim gets M-j)" -n 'M-j' if-shell "$is_vim" 'send-keys M-j' 'resize-pane -D 8'
bind -N "Resize pane up (nvim gets M-k)" -n 'M-k' if-shell "$is_vim" 'send-keys M-k' 'resize-pane -U 8'
bind -N "Resize pane right (nvim gets M-l)" -n 'M-l' if-shell "$is_vim" 'send-keys M-l' 'resize-pane -R 8'
bind-key -N "Resize pane left" -T copy-mode-vi M-h resize-pane -L 5
bind-key -N "Resize pane down" -T copy-mode-vi M-j resize-pane -D 5
bind-key -N "Resize pane up" -T copy-mode-vi M-k resize-pane -U 5
bind-key -N "Resize pane right" -T copy-mode-vi M-l resize-pane -R 5

# Session picker is tmux-sessionx on <prefix>s -- see plugins.conf.
# Default last-session can't find the previous session once one is closed
# under detach-on-destroy off; sesh last can.
bind -N "last-session (via sesh)" L run-shell "sesh last"
