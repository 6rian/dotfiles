# vim:set ft=tmux:

# Light palette: used when Ghostty (following macOS) reports a light
# background. theme.conf sources it at startup and apply-theme.sh on a switch;
# theme-dark.conf must set every option this file sets, and vice versa.
set -g @theme-variant light

# Colours from ghostty/themes/xeno-cyberpunk-v3-light: background #e9dff5,
# text #1e0039, purple #9600fa, blue #0059c4, pink #a3005f, cyan #00707f,
# green #006b1c, amber #7a4d00. The dark palette puts dark text on bright
# segments; here it's the reverse: deep-coloured segments with light text
# (#f3e8ff, Ghostty's cursor-text), every pair >= 4.5:1 (WCAG).
# @tmux2k-black only colours the current window's flags (see
# theme-dark.conf), which sit on purple here, so it's the light text colour.
set -g @tmux2k-black '#f3e8ff'
set -g @tmux2k-gray '#d6c8e6'
set -g @tmux2k-white '#f3e8ff'
set -g @tmux2k-text '#1e0039'
set -g @tmux2k-bg-main '#e9dff5'
set -g @tmux2k-bg-alt '#d6c8e6'

set -g @tmux2k-blue '#0059c4'
set -g @tmux2k-light-blue '#0067de'
set -g @tmux2k-dark-blue '#004a9e'

set -g @tmux2k-green '#006b1c'
set -g @tmux2k-light-green '#008022'
set -g @tmux2k-dark-green '#00521a'

# Amber, not yellow: other windows' names are this colour on bg-alt (4.6:1).
set -g @tmux2k-yellow '#7a4d00'
set -g @tmux2k-light-yellow '#9a6400'
set -g @tmux2k-dark-yellow '#5c3a00'
set -g @tmux2k-light-orange '#9a6400'
set -g @tmux2k-dark-orange '#5c3a00'

set -g @tmux2k-light-pink '#c40076'
set -g @tmux2k-dark-pink '#7a0047'

# Drives `pink` too (upstream bug, see theme-dark.conf).
set -g @tmux2k-light-purple '#a3005f'
set -g @tmux2k-purple '#9600fa'
set -g @tmux2k-dark-purple '#6a00b8'

set -g @tmux2k-red '#a8001f'
set -g @tmux2k-light-red '#d1002a'
set -g @tmux2k-dark-red '#800018'

set -g @tmux2k-prefix-highlight '#00707f'
set -g @tmux2k-message-bg '#00707f'
set -g @tmux2k-message-fg '#f3e8ff'

set -g @tmux2k-pane-active-border '#9600fa'
set -g @tmux2k-pane-border '#a08cc0'

# Light text (`white`) on every segment: pink 6.5:1, green 5.7:1, blue
# 5.5:1, dark purple 7.7:1, and the cyan prefix highlight 4.9:1.
set -g @tmux2k-session-colors 'pink white'
set -g @tmux2k-git-colors 'green white'
set -g @tmux2k-cwd-colors 'blue white'
set -g @tmux2k-cpu-colors 'blue white'
set -g @tmux2k-ram-colors 'green white'
set -g @tmux2k-battery-colors 'pink white'
set -g @tmux2k-network-colors 'purple white'
set -g @tmux2k-time-colors 'dark_purple white'
# Current window: light text on purple (4.8:1). Others: amber on bg-alt.
set -g @tmux2k-window-list-colors 'white purple'

set -gq popup-border-style 'fg=#9600fa'
set -gq menu-border-style 'fg=#9600fa'
set -g @floax-border-color '#9600fa'
setenv -g FLOAX_BORDER_COLOR '#9600fa'
