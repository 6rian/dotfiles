# vim:set ft=tmux:

# Popup/menu look, and the bindings that open popups.

# tmux 3.8 themes popups/menus gray by default (and misdetects Ghostty's dark
# background as light); use the terminal's own colours instead.
# -q: popup-* need tmux 3.3+ and menu-border-style 3.4+; ignore on older hosts.
set -gq popup-style 'bg=default,fg=default'
set -gq popup-border-style 'fg=#a15bff'
set -gq menu-style 'bg=default,fg=default'
set -gq menu-border-style 'fg=#a15bff'
set -gq popup-border-lines rounded
set -gq menu-border-lines rounded

bind -N "workmux dashboard" a display-popup -h 90% -w 90% -E "workmux dashboard"
bind -N "lazygit (popup)" g display-popup -d '#{pane_current_path}' -w 90% -h 90% -E lazygit

# tmux-file-picker (~/.local/bin): fuzzy-pick files and directories, and insert paths into the pane
# TMUX_FILE_PICKER_FD_FLAGS replaces the defaults (-H --follow --type f --exclude .git)
bind -N "Pick a file, insert its path" f display-popup -E -h 80% -w 80% "TMUX_FILE_PICKER_FD_FLAGS='-H --follow --type f --exclude .git --exclude node_modules' tmux-file-picker --zoxide"
bind -N "Pick a directory, insert its path" F display-popup -E -h 80% -w 80% "TMUX_FILE_PICKER_FD_FLAGS='-H --follow --type d --exclude .git --exclude node_modules' tmux-file-picker --directories --zoxide"
