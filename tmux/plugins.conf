# vim:set ft=tmux:

# Every TPM @plugin line and plugin option. ~/.tmux.conf must source this
# file directly, with a literal path: TPM finds @plugin lines by scanning the
# entry file's text and follows only plain, one-level source-file lines.

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-cowboy'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'alexwforsythe/tmux-which-key'
# set -g @plugin 'tmux-plugins/tmux-battery'
# set -g @plugin 'tmux-plugins/tmux-cpu'
# set -g @plugin 'tmux-plugins/tmux-online-status'

set -g @plugin 'omerxx/tmux-floax'
set -g @floax-bind 't'
set -g @floax-changepath 'true'
set -g @floax-width '90%'
set -g @floax-height '90%'
# @floax-border-color is set by the light/dark palette (theme-dark.conf / theme-light.conf)
set -g @floax-text-color 'white'

# sessionx: fuzzy session picker with pane previews. Typing a name that
# isn't a session falls through to zoxide, then creates a new session.
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 's'
set -g @sessionx-window-height '80%'
set -g @sessionx-window-width '80%'
set -g @sessionx-zoxide-mode 'on'
# `fzf --tmux` instead of the fzf-tmux script; needs fzf >= 0.53, which
# mise provides ahead of apt's /usr/bin/fzf on tmux's PATH.
set -g @sessionx-fzf-builtin-tmux 'on'
# C-x browses this dir instead of ~/.config
set -g @sessionx-x-path "$HOME/repos"
# Hide floax's popup session
set -g @sessionx-filtered-sessions 'scratch'

# Override default keymaps for vim-tmux-navigator
# https://github.com/christoomey/vim-tmux-navigator/?tab=readme-ov-file#tpm
set -g @vim_navigator_mapping_left "C-Left C-h"  # use C-h and C-Left
set -g @vim_navigator_mapping_right "C-Right C-l"
set -g @vim_navigator_mapping_up "C-k"
set -g @vim_navigator_mapping_down "C-j"
set -g @vim_navigator_mapping_prev ""  # removes the C-\ binding
set -g @vim_navigator_mapping_next "" # removes the C-Space binding

# Session persistence across reboots: continuum autosaves via resurrect
# every 15 minutes and restores on tmux server start. Must stay the LAST
# plugins: continuum's autosave hooks into status-right, and silently stops
# if a theme overwrites status-right after it. (tmux2k in theme.conf runs
# before TPM loads these, so that order holds.)
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# Pinned so the save dir is the same on every host (resurrect's default
# depends on whether ~/.tmux/resurrect already exists).
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
set -g @continuum-restore 'on'
