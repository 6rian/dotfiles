# vim:set ft=tmux:

# Clipboard over OSC 52, both ways. Kept on its own so it's easy to leave
# alone: this exact pair fixed nvim paste over SSH (2026-11-11).

# Clipboard via OSC 52: forward apps' clipboard writes to the outer terminal...
set -g set-clipboard on
# ...and answer apps' clipboard reads (e.g. nvim paste) by asking the outer
# terminal, instead of replying with tmux's own newest paste buffer (the
# default, `buffer`). -q: tolerate a tmux too old to have this option.
set -sq get-clipboard request
