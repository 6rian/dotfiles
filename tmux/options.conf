# vim:set ft=tmux:

# Server, session and window options. Sourced first by ~/.tmux.conf.

# default-terminal is left at tmux's built-in default, tmux-256color (gives
# italics and undercurl inside tmux; the old screen-256color had neither).

# Let apps send escape sequences straight to the outer terminal (OSC 9/777
# desktop notifications, etc.). `all` instead of `on`: `on` drops passthrough
# from panes that aren't visible, which are exactly the background agent
# windows. The clipboard doesn't use this (see clipboard.conf).
set -g allow-passthrough all

# Enable support for extended keys (like F1-F12) in tmux
set -s extended-keys on
# Fixed index, not `set -as`: appending adds a duplicate entry on every
# config reload (prefix r). Re-setting the same slot is idempotent.
set -s terminal-features[90] 'xterm*:extkeys'

# Resize panes using mouse
set -g mouse on

# Use vi keybindings in copy mode
set -g mode-keys vi
# ...and in the command prompt (prefix :). Explicit, so it doesn't depend on
# $EDITOR (tmux picks vi only when EDITOR/VISUAL contains "vi").
set -g status-keys vi

# Set base index for windows and panes to 1 instead of 0
set -g base-index 1
set -g pane-base-index 1

# window look and feel: name windows after their directory
set -wg automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}"

# Terminal (Ghostty) tab/window title follows the session and pane title
set -g set-titles on
set -g set-titles-string "#S: #T"

# Don't detach on destroy, so that when a window is closed, the session remains attached
set -g detach-on-destroy off

# Automatically renumber windows when a window is closed
set -g renumber-windows on

# Move status bar to top
set-option -g status-position top

# Increase scrollback buffer size from 2000 to 100000 lines
set -g history-limit 100000

# Focus in/out events reach apps (nvim's FocusGained/autoread, Claude Code)
set -g focus-events on

# No key repeat after the prefix: a key pressed right after a prefix command
# is always a new command. Built-in repeatable keys (prefix arrows,
# prefix M-arrows) no longer repeat.
set -g repeat-time 0

# Formerly from tmux-sensible
set -g display-time 4000      # messages stay up for 4 seconds
set -g status-interval 5      # (tmux2k sets its own refresh rate after this)
set -wg aggressive-resize on  # size windows to the smallest client actually viewing them
