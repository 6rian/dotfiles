# vim:set ft=tmux:

# Status bar: tmux2k, vendored in plugins/tmux2k and loaded manually (not
# via TPM). Colours follow the terminal's light/dark theme: theme-dark.conf
# and theme-light.conf hold the palettes, apply-theme.sh switches them.

# Configure tmux2k BEFORE loading it
set -g @tmux2k-theme 'cyberpunk'
set -g @tmux2k-left-plugins 'session git'
set -g @tmux2k-right-plugins 'cpu ram time'

# Window list entry: index, name, then the workmux agent status icon (🤖/💬/✅)
# when the window has one. workmux sets @workmux_status from Claude hooks;
# its own format rewrite is off (status_format: false in workmux/config.yaml)
# because it would replace tmux2k's styling.
set -g @tmux2k-window-list-format '#I:#W#{?@workmux_status, #{@workmux_status},}'

# Palette for the current client's theme. On a server's first start there's
# no client yet, so this picks dark; the hooks below switch to light once
# Ghostty reports it.
if -F '#{==:#{client_theme},light}' \
  'source-file ~/.config/tmux/theme-light.conf' \
  'source-file ~/.config/tmux/theme-dark.conf'

# Load tmux2k manually
run "$HOME/.config/tmux/plugins/tmux2k/2k.tmux"

# Re-theme when the terminal reports a light/dark switch (Ghostty follows
# macOS; works over SSH too). The palette is server-wide, so with clients in
# different themes attached, the last one to switch wins.
set-hook -g client-light-theme 'run-shell "~/.config/tmux/apply-theme.sh light"'
set-hook -g client-dark-theme 'run-shell "~/.config/tmux/apply-theme.sh dark"'
