# vim:set ft=tmux:

# Keymap to reload tmux config
unbind r
bind r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

set -g default-terminal "screen-256color"

# Set prefix key
set -g prefix C-space
bind C-space send-prefix

# Skip "kill-pane 1? (y/n)" prompt
bind-key x kill-pane

# New session, prompting for a name
bind S command-prompt -p "New session name:" "new-session -s '%%'"

# Allow passthrough of unbound keys to the terminal (e.g., for Vim or other applications)
set -g allow-passthrough on

# Enable support for extended keys (like F1-F12) in tmux
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Use HJKL to navigate panes
# bind-key h select-pane -L
# bind-key j select-pane -D
# bind-key k select-pane -U
# bind-key l select-pane -R

# Resize panes using mouse
set -g mouse on

# Use vi keybindings in copy mode
set -g mode-keys vi

# Set base index for windows and panes to 1 instead of 0
set -g base-index 1
set -g pane-base-index 1

# window look and feel
set -wg automatic-rename on
set -g automatic-rename-format "Window"

# Enable system clipboard integration (requires xclip or pbcopy/pbpaste)
set -g set-clipboard on

# Don't detach on destroy, so that when a window is closed, the session remains attached
set -g detach-on-destroy off

# Automatically renumber windows when a window is closed
set -g renumber-window on

# Move status bar to top
set-option -g status-position top

# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 100000

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Zero-out escape time delay for quicker response
set -g escape-time 0

# Open the new panes in the current path
bind v split-window -v -c "#{pane_current_path}"
bind h split-window -h -c "#{pane_current_path}"

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Pane resizing
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n 'M-h' if-shell "$is_vim" 'send-keys M-h' 'resize-pane -L 8'
bind -n 'M-j' if-shell "$is_vim" 'send-keys M-j' 'resize-pane -D 8'
bind -n 'M-k' if-shell "$is_vim" 'send-keys M-k' 'resize-pane -U 8'
bind -n 'M-l' if-shell "$is_vim" 'send-keys M-l' 'resize-pane -R 8'
bind-key -T copy-mode-vi M-h resize-pane -L 5
bind-key -T copy-mode-vi M-j resize-pane -D 5
bind-key -T copy-mode-vi M-k resize-pane -U 5
bind-key -T copy-mode-vi M-l resize-pane -R 5

bind a display-popup -h 90% -w 90% -E "workmux dashboard"

# tmux-file-picker (~/.local/bin): fuzzy-pick files and directories, and insert paths into the pane
# TMUX_FILE_PICKER_FD_FLAGS replaces the defaults (-H --follow --type f --exclude .git)
bind f display-popup -E -h 80% -w 80% "TMUX_FILE_PICKER_FD_FLAGS='-H --follow --type f --exclude .git --exclude node_modules' tmux-file-picker --zoxide"
bind F display-popup -E -h 80% -w 80% "TMUX_FILE_PICKER_FD_FLAGS='-H --follow --type d --exclude .git --exclude node_modules' tmux-file-picker --directories --zoxide"

##############
# PLUGINS
##############

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-cowboy'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'alexwforsythe/tmux-which-key'
# set -g @plugin 'tmux-plugins/tmux-battery'
# set -g @plugin 'tmux-plugins/tmux-cpu'
# set -g @plugin 'tmux-plugins/tmux-online-status'

set -g @plugin 'omerxx/tmux-floax'
set -g @floax-bind 't'
set -g @floax-changepath 'true'
set -g @floax-width '90%'
set -g @floax-height '90%'
set -g @floax-border-color '#a15bff'
set -g @floax-text-color 'white'

# Configure tmux2k BEFORE loading it
set -g @tmux2k-theme 'cyberpunk'
set -g @tmux2k-left-plugins 'session git cwd'
set -g @tmux2k-right-plugins 'cpu ram battery network time'

# Palette override to match the xeno.nvim "xeno-cyberpunk-v2" colorscheme and
# the kitty theme in .config/kitty/xeno-cyberpunk-v2.conf: background #0b0d10,
# accent #e8e34a, teal #089ED9, green #7EA929, indigo #7E4AE6, magenta
# #F11FCB (these four match the brightened custom colors currently set in
# xeno.lua). The 'cyberpunk' theme case in tmux2k's main.sh reads every one
# of these @tmux2k-* options before falling back to its own defaults.
set -g @tmux2k-black '#0b0d10'
set -g @tmux2k-gray '#1c2024'
set -g @tmux2k-white '#eef1f0'
# Used as the window-list segment's background (paired with a yellow fg by
# default), not as body text — kept dark. Per-segment fg below is what
# actually controls contrast on the colored plugin segments.
set -g @tmux2k-text '#0b0d10'
set -g @tmux2k-bg-main '#0b0d10'
set -g @tmux2k-bg-alt '#1c2024'

set -g @tmux2k-blue '#7E4AE6'
set -g @tmux2k-light-blue '#a98aff'
set -g @tmux2k-dark-blue '#4a2f8f'

set -g @tmux2k-green '#7EA929'
set -g @tmux2k-light-green '#a4d94a'
set -g @tmux2k-dark-green '#4d6b1a'

set -g @tmux2k-yellow '#e8e34a'
set -g @tmux2k-light-yellow '#f5f08a'
set -g @tmux2k-dark-yellow '#a89b2e'
set -g @tmux2k-light-orange '#f5f08a'
set -g @tmux2k-dark-orange '#a89b2e'

set -g @tmux2k-light-pink '#ff6fe0'
set -g @tmux2k-dark-pink '#a30f96'

# tmux2k's main.sh has an upstream bug: `pink` (used by the session/battery
# segments) reads @tmux2k-light-purple instead of a dedicated @tmux2k-pink
# option, and `light_purple` reads that same key — so this one value drives
# both. Set to our magenta so the visible segments match.
set -g @tmux2k-light-purple '#F11FCB'
set -g @tmux2k-purple '#a15bff'
set -g @tmux2k-dark-purple '#5c3f8f'

set -g @tmux2k-red '#ff3b52'
set -g @tmux2k-light-red '#ff7a8a'
set -g @tmux2k-dark-red '#b81f36'

set -g @tmux2k-prefix-highlight '#e8e34a'
set -g @tmux2k-message-bg '#e8e34a'
set -g @tmux2k-message-fg '#0b0d10'

set -g @tmux2k-pane-active-border '#a15bff'
set -g @tmux2k-pane-border '#5c3f8f'

# Per-segment fg overrides (WCAG-checked against the bg above; `text` and
# `white` alone can't satisfy every segment since backgrounds span a wide
# lightness range — e.g. text(dark)-on-magenta is 5.4:1 but
# white-on-magenta is only 3.6:1, while text(dark)-on-indigo is a marginal
# 3.7:1 and white-on-indigo is 4.6:1). Note: tmux2k's cyberpunk case names
# its near-black variable `iblack`, not `black` — `black` isn't a valid
# token here, so the dark option below reuses `text` (set dark above).
set -g @tmux2k-session-colors 'pink text'
set -g @tmux2k-git-colors 'green text'
set -g @tmux2k-cwd-colors 'blue white'
set -g @tmux2k-cpu-colors 'blue white'
set -g @tmux2k-ram-colors 'green text'
set -g @tmux2k-battery-colors 'pink text'
set -g @tmux2k-network-colors 'purple text'
set -g @tmux2k-time-colors 'dark_purple white'

# Load tmux2k manually
run "$HOME/.config/tmux/plugins/tmux2k/2k.tmux"

# Override default keymaps for vim-tmux-navigator
# https://github.com/christoomey/vim-tmux-navigator/?tab=readme-ov-file#tpm
set -g @vim_navigator_mapping_left "C-Left C-h"  # use C-h and C-Left
set -g @vim_navigator_mapping_right "C-Right C-l"
set -g @vim_navigator_mapping_up "C-k"
set -g @vim_navigator_mapping_down "C-j"
set -g @vim_navigator_mapping_prev ""  # removes the C-\ binding
set -g @vim_navigator_mapping_next "" # removes the C-Space binding

# Must come after tmux-sensible / TPM plugin initialization
set -g focus-events off

##############
# TPM
# Press Prefix + I (capital i, as in Install) to install plugins.
#
# Note: Keep this line below the plugin list.
##############
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'

# tmux-which-key: open its menu with <Leader>? (plugin defaults to <Leader>Space,
# so restore Space's default next-layout binding)
bind Space next-layout
bind ? show-wk-menu-root
###############
