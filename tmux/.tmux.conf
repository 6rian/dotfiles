# vim:set ft=tmux:

# Keymap to reload tmux config
unbind r
bind -N "Reload ~/.tmux.conf" r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# default-terminal is left at tmux's built-in default, tmux-256color (gives
# italics and undercurl inside tmux; the old screen-256color had neither).

# Set prefix key
set -g prefix C-space
unbind C-b
bind -N "Send the prefix to the app" C-space send-prefix

# Skip "kill-pane 1? (y/n)" prompt
bind-key -N "Kill the pane (no confirmation)" x kill-pane

# New session, prompting for a name
bind -N "New session (prompts for a name)" S command-prompt -p "New session name:" "new-session -s '%%'"

# Let apps send escape sequences straight to the outer terminal (OSC 9/777
# desktop notifications, etc.). `all` instead of `on`: `on` drops passthrough
# from panes that aren't visible, which are exactly the background agent
# windows. The clipboard doesn't use this (see set-clipboard below).
set -g allow-passthrough all

# Enable support for extended keys (like F1-F12) in tmux
set -s extended-keys on
# Fixed index, not `set -as`: appending adds a duplicate entry on every
# config reload (prefix r). Re-setting the same slot is idempotent.
set -s terminal-features[90] 'xterm*:extkeys'

# Use HJKL to navigate panes
# bind-key h select-pane -L
# bind-key j select-pane -D
# bind-key k select-pane -U
# bind-key l select-pane -R

# Resize panes using mouse
set -g mouse on

# Use vi keybindings in copy mode
set -g mode-keys vi
# ...and in the command prompt (prefix :). Explicit, so it doesn't depend on
# $EDITOR (tmux picks vi only when EDITOR/VISUAL contains "vi").
set -g status-keys vi

# Set base index for windows and panes to 1 instead of 0
set -g base-index 1
set -g pane-base-index 1

# window look and feel: name windows after their directory
set -wg automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}"

# Terminal (Ghostty) tab/window title follows the session and pane title
set -g set-titles on
set -g set-titles-string "#S: #T"

# Clipboard via OSC 52: forward apps' clipboard writes to the outer terminal...
set -g set-clipboard on
# ...and answer apps' clipboard reads (e.g. nvim paste) by asking the outer
# terminal, instead of replying with tmux's own newest paste buffer (the
# default, `buffer`). -q: tolerate a tmux too old to have this option.
set -sq get-clipboard request

# Don't detach on destroy, so that when a window is closed, the session remains attached
set -g detach-on-destroy off

# Automatically renumber windows when a window is closed
set -g renumber-windows on

# Move status bar to top
set-option -g status-position top

# Increase scrollback buffer size from 2000 to 100000 lines
set -g history-limit 100000

# Focus in/out events reach apps (nvim's FocusGained/autoread, Claude Code)
set -g focus-events on

# No key repeat after the prefix: a key pressed right after a prefix command
# is always a new command. Built-in repeatable keys (prefix arrows,
# prefix M-arrows) no longer repeat.
set -g repeat-time 0

# Formerly from tmux-sensible
set -g display-time 4000      # messages stay up for 4 seconds
set -g status-interval 5      # (tmux2k sets its own refresh rate after this)
set -wg aggressive-resize on  # size windows to the smallest client actually viewing them

# Shift arrow to switch windows
bind -N "Previous window" -n S-Left  previous-window
bind -N "Next window" -n S-Right next-window

# Ctrl-Shift arrow to move the current window left/right
bind -N "Move window left" -n C-S-Left  swap-window -t -1 \; previous-window
bind -N "Move window right" -n C-S-Right swap-window -t +1 \; next-window

# Open the new panes in the current path
bind -N "Split top/bottom" v split-window -v -c "#{pane_current_path}"
bind -N "Split left/right" h split-window -h -c "#{pane_current_path}"

# Split panes using | and -
bind -N "Split left/right" | split-window -h -c "#{pane_current_path}"
bind -N "Split top/bottom" - split-window -v -c "#{pane_current_path}"

# Pane resizing. is_vim is vim-tmux-navigator's check (keep in sync with its
# vim-tmux-navigator.tmux), so M-hjkl pass through to nvim (and fzf).
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -N "Resize pane left (nvim gets M-h)" -n 'M-h' if-shell "$is_vim" 'send-keys M-h' 'resize-pane -L 8'
bind -N "Resize pane down (nvim gets M-j)" -n 'M-j' if-shell "$is_vim" 'send-keys M-j' 'resize-pane -D 8'
bind -N "Resize pane up (nvim gets M-k)" -n 'M-k' if-shell "$is_vim" 'send-keys M-k' 'resize-pane -U 8'
bind -N "Resize pane right (nvim gets M-l)" -n 'M-l' if-shell "$is_vim" 'send-keys M-l' 'resize-pane -R 8'
bind-key -N "Resize pane left" -T copy-mode-vi M-h resize-pane -L 5
bind-key -N "Resize pane down" -T copy-mode-vi M-j resize-pane -D 5
bind-key -N "Resize pane up" -T copy-mode-vi M-k resize-pane -U 5
bind-key -N "Resize pane right" -T copy-mode-vi M-l resize-pane -R 5

# tmux 3.8 themes popups/menus gray by default (and misdetects Ghostty's dark
# background as light); use the terminal's own colours instead.
# -q: popup-* need tmux 3.3+ and menu-border-style 3.4+; ignore on older hosts.
set -gq popup-style 'bg=default,fg=default'
set -gq popup-border-style 'fg=#a15bff'
set -gq menu-style 'bg=default,fg=default'
set -gq menu-border-style 'fg=#a15bff'
set -gq popup-border-lines rounded
set -gq menu-border-lines rounded

bind -N "workmux dashboard" a display-popup -h 90% -w 90% -E "workmux dashboard"
bind -N "lazygit (popup)" g display-popup -d '#{pane_current_path}' -w 90% -h 90% -E lazygit

# tmux-file-picker (~/.local/bin): fuzzy-pick files and directories, and insert paths into the pane
# TMUX_FILE_PICKER_FD_FLAGS replaces the defaults (-H --follow --type f --exclude .git)
bind -N "Pick a file, insert its path" f display-popup -E -h 80% -w 80% "TMUX_FILE_PICKER_FD_FLAGS='-H --follow --type f --exclude .git --exclude node_modules' tmux-file-picker --zoxide"
bind -N "Pick a directory, insert its path" F display-popup -E -h 80% -w 80% "TMUX_FILE_PICKER_FD_FLAGS='-H --follow --type d --exclude .git --exclude node_modules' tmux-file-picker --directories --zoxide"

# Session picker is tmux-sessionx on <prefix>s -- see PLUGINS below.
# Default last-session can't find the previous session once one is closed
# under detach-on-destroy off; sesh last can.
bind -N "last-session (via sesh)" L run-shell "sesh last"

##############
# PLUGINS
##############

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-cowboy'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'alexwforsythe/tmux-which-key'
# set -g @plugin 'tmux-plugins/tmux-battery'
# set -g @plugin 'tmux-plugins/tmux-cpu'
# set -g @plugin 'tmux-plugins/tmux-online-status'

set -g @plugin 'omerxx/tmux-floax'
set -g @floax-bind 't'
set -g @floax-changepath 'true'
set -g @floax-width '90%'
set -g @floax-height '90%'
set -g @floax-border-color '#a15bff'
set -g @floax-text-color 'white'

# sessionx: fuzzy session picker with pane previews. Typing a name that
# isn't a session falls through to zoxide, then creates a new session.
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 's'
set -g @sessionx-window-height '80%'
set -g @sessionx-window-width '80%'
set -g @sessionx-zoxide-mode 'on'
# `fzf --tmux` instead of the fzf-tmux script; needs fzf >= 0.53, which
# mise provides ahead of apt's /usr/bin/fzf on tmux's PATH.
set -g @sessionx-fzf-builtin-tmux 'on'
# C-x browses this dir instead of ~/.config
set -g @sessionx-x-path "$HOME/repos"
# Hide floax's popup session
set -g @sessionx-filtered-sessions 'scratch'

# Configure tmux2k BEFORE loading it
set -g @tmux2k-theme 'cyberpunk'
set -g @tmux2k-left-plugins 'session git cwd'
set -g @tmux2k-right-plugins 'cpu ram battery network time'

# Palette override to match the xeno.nvim "xeno-cyberpunk-v2" colorscheme and
# the kitty theme in .config/kitty/xeno-cyberpunk-v2.conf: background #0b0d10,
# accent #e8e34a, teal #089ED9, green #7EA929, indigo #7E4AE6, magenta
# #F11FCB (these four match the brightened custom colors currently set in
# xeno.lua). The 'cyberpunk' theme case in tmux2k's main.sh reads every one
# of these @tmux2k-* options before falling back to its own defaults.
set -g @tmux2k-black '#0b0d10'
set -g @tmux2k-gray '#1c2024'
set -g @tmux2k-white '#eef1f0'
# Used as the window-list segment's background (paired with a yellow fg by
# default), not as body text — kept dark. Per-segment fg below is what
# actually controls contrast on the colored plugin segments.
set -g @tmux2k-text '#0b0d10'
set -g @tmux2k-bg-main '#0b0d10'
set -g @tmux2k-bg-alt '#1c2024'

set -g @tmux2k-blue '#7E4AE6'
set -g @tmux2k-light-blue '#a98aff'
set -g @tmux2k-dark-blue '#4a2f8f'

set -g @tmux2k-green '#7EA929'
set -g @tmux2k-light-green '#a4d94a'
set -g @tmux2k-dark-green '#4d6b1a'

set -g @tmux2k-yellow '#e8e34a'
set -g @tmux2k-light-yellow '#f5f08a'
set -g @tmux2k-dark-yellow '#a89b2e'
set -g @tmux2k-light-orange '#f5f08a'
set -g @tmux2k-dark-orange '#a89b2e'

set -g @tmux2k-light-pink '#ff6fe0'
set -g @tmux2k-dark-pink '#a30f96'

# tmux2k's main.sh has an upstream bug: `pink` (used by the session/battery
# segments) reads @tmux2k-light-purple instead of a dedicated @tmux2k-pink
# option, and `light_purple` reads that same key — so this one value drives
# both. Set to our magenta so the visible segments match.
set -g @tmux2k-light-purple '#F11FCB'
set -g @tmux2k-purple '#a15bff'
set -g @tmux2k-dark-purple '#5c3f8f'

set -g @tmux2k-red '#ff3b52'
set -g @tmux2k-light-red '#ff7a8a'
set -g @tmux2k-dark-red '#b81f36'

set -g @tmux2k-prefix-highlight '#e8e34a'
set -g @tmux2k-message-bg '#e8e34a'
set -g @tmux2k-message-fg '#0b0d10'

set -g @tmux2k-pane-active-border '#a15bff'
set -g @tmux2k-pane-border '#5c3f8f'

# Per-segment fg overrides (WCAG-checked against the bg above; `text` and
# `white` alone can't satisfy every segment since backgrounds span a wide
# lightness range — e.g. text(dark)-on-magenta is 5.4:1 but
# white-on-magenta is only 3.6:1, while text(dark)-on-indigo is a marginal
# 3.7:1 and white-on-indigo is 4.6:1). Note: tmux2k's cyberpunk case names
# its near-black variable `iblack`, not `black` — `black` isn't a valid
# token here, so the dark option below reuses `text` (set dark above).
set -g @tmux2k-session-colors 'pink text'
set -g @tmux2k-git-colors 'green text'
set -g @tmux2k-cwd-colors 'blue white'
set -g @tmux2k-cpu-colors 'blue white'
set -g @tmux2k-ram-colors 'green text'
set -g @tmux2k-battery-colors 'pink text'
set -g @tmux2k-network-colors 'purple text'
set -g @tmux2k-time-colors 'dark_purple white'

# Load tmux2k manually
run "$HOME/.config/tmux/plugins/tmux2k/2k.tmux"

# Override default keymaps for vim-tmux-navigator
# https://github.com/christoomey/vim-tmux-navigator/?tab=readme-ov-file#tpm
set -g @vim_navigator_mapping_left "C-Left C-h"  # use C-h and C-Left
set -g @vim_navigator_mapping_right "C-Right C-l"
set -g @vim_navigator_mapping_up "C-k"
set -g @vim_navigator_mapping_down "C-j"
set -g @vim_navigator_mapping_prev ""  # removes the C-\ binding
set -g @vim_navigator_mapping_next "" # removes the C-Space binding

# Session persistence across reboots: continuum autosaves via resurrect
# every 15 minutes and restores on tmux server start. Must stay the LAST
# plugins: continuum's autosave hooks into status-right, and silently stops
# if a theme (tmux2k, loaded above) overwrites status-right after it.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# Pinned so the save dir is the same on every host (resurrect's default
# depends on whether ~/.tmux/resurrect already exists).
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
set -g @continuum-restore 'on'

##############
# TPM
# Press Prefix + I (capital i, as in Install) to install plugins.
#
# Note: Keep this line below the plugin list.
##############
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'

# tmux-which-key: open its menu with <Leader>? (plugin defaults to <Leader>Space,
# so restore Space's default next-layout binding)
bind -N "Next layout" Space next-layout
bind -N "which-key menu" ? show-wk-menu-root
###############
