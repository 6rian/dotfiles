# vim:set ft=tmux:

# Entry file. The config itself lives in ~/.config/tmux/*.conf (linked from
# this repo's tmux/ by install.sh); see tmux/README.md "Where things live".
# Keep these as plain, literal source-file lines: TPM scans this file's text
# for them to find plugins.conf.

source-file ~/.config/tmux/options.conf
source-file ~/.config/tmux/clipboard.conf
source-file ~/.config/tmux/bindings.conf
source-file ~/.config/tmux/popups.conf
source-file ~/.config/tmux/plugins.conf
source-file ~/.config/tmux/theme.conf

##############
# TPM
# Press Prefix + I (capital i, as in Install) to install plugins.
#
# Note: Keep this below the plugins.conf and theme.conf sources.
##############
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'

source-file ~/.config/tmux/after-plugins.conf

# Untracked per-host overrides (optional). Must not set status-right.
source-file -q ~/.config/tmux/local.conf
